<!DOCTYPE html>
<script>
let eventSource;

function start() { // quando o botão "Começar" é pressionado
  if (!window.EventSource) {
    // IE ou um navegador antigo
    alert("O navegador não suporta EventSource.");
    return;
  }

  eventSource = new EventSource('digits');

  eventSource.onopen = function(e) {
    log("Evento: open");
  };

  eventSource.onerror = function(e) {
    log("Evento: error");
    if (this.readyState == EventSource.CONNECTING) {
      log(`Reconectando (readyState=${this.readyState})...`);
    } else {
      log("Ocorreu um erro.");
    }
  };

  eventSource.addEventListener('bye', function(e) {
    log("Evento: bye, data: " + e.data);
  });

  eventSource.onmessage = function(e) {
    log("Evento: message, data: " + e.data);
  };
}

function stop() { // quando o botão "Parar" é pressionado
  eventSource.close();
  log("eventSource.close()");
}

function log(msg) {
  logElem.innerHTML += msg + "<br>";
  document.documentElement.scrollTop = 99999999;
}
</script>

<button onclick="start()">Começar</button> Clique em "Começar" para iniciar.
<div id="logElem" style="margin: 6px 0"></div>

<button onclick="stop()">Parar</button> "Parar" para terminar.
