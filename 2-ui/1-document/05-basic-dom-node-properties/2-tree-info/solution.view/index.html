<!DOCTYPE HTML>
<html>
<body>

  <ul>
    <li>Animais
      <ul>
        <li>Mamíferos
          <ul>
            <li>Vacas</li>
            <li>Burros</li>
            <li>Cachorros</li>
            <li>Tigres</li>
          </ul>
        </li>
        <li>Outros
          <ul>
            <li>Cobras</li>
            <li>Pássaros</li>
            <li>Lagartos</li>
          </ul>
        </li>
      </ul>
    </li>
    <li>Peixes
      <ul>
        <li>Aquário
          <ul>
            <li>Guppy</li>
            <li>Peixe-anjo</li>
          </ul>
        </li>
        <li>Mar
          <ul>
            <li>Truta marinha</li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>

  <script>
    for (let li of document.querySelectorAll('li')) {
      // obtém o título a partir do nó de texto
      let title = li.firstChild.data;

      title = title.trim(); // remove espaços extras das pontas

      // obtém a contagem de descendentes
      let count = li.getElementsByTagName('li').length;

      alert(title + ': ' + count);
    }
  </script>

</body>
</html>
