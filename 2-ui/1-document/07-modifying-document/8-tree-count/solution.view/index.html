<!DOCTYPE HTML>
<html>
<body>

  <ul>
    <li>Animais
      <ul>
        <li>Mamíferos
          <ul>
            <li>Vacas</li>
            <li>Burros</li>
            <li>Cachorros</li>
            <li>Tigres</li>
          </ul>
        </li>
        <li>Outros
          <ul>
            <li>Cobras</li>
            <li>Pássaros</li>
            <li>Lagartos</li>
          </ul>
        </li>
      </ul>
    </li>
    <li>Peixes
      <ul>
        <li>Aquário
          <ul>
            <li>Guppy</li>
            <li>Peixe-anjo</li>
          </ul>
        </li>
        <li>Mar
          <ul>
            <li>Truta marinha</li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>

  <script>
    let lis = document.getElementsByTagName('li');

    for (let li of lis) {
      // obtém a contagem de todos os <li> abaixo deste <li>
      let descendantsCount = li.getElementsByTagName('li').length;
      if (!descendantsCount) continue;

      // adiciona diretamente ao nó de texto (anexa ao texto)
      li.firstChild.data += ' [' + descendantsCount + ']';
    }
  </script>

</body>
</html>
