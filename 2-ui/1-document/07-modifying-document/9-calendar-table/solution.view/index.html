<!DOCTYPE HTML>
<html>

<head>
  <style>
    table {
      border-collapse: collapse;
    }

    td,
    th {
      border: 1px solid black;
      padding: 3px;
      text-align: center;
    }

    th {
      font-weight: bold;
      background-color: #E6E6E6;
    }
  </style>
</head>

<body>


  <div id="calendar"></div>

  <script>
    function createCalendar(elem, year, month) {

      let mon = month - 1; // meses em JS vão de 0..11, não de 1..12
      let d = new Date(year, mon);

      let table = '<table><tr><th>SEG</th><th>TER</th><th>QUA</th><th>QUI</th><th>SEX</th><th>SÁB</th><th>DOM</th></tr><tr>';

      // espaços para a primeira linha
      // de segunda-feira até o primeiro dia do mês
      // * * * 1  2  3  4
      for (let i = 0; i < getDay(d); i++) {
        table += '<td></td>';
      }

      // <td> com as datas reais
      while (d.getMonth() == mon) {
        table += '<td>' + d.getDate() + '</td>';

        if (getDay(d) % 7 == 6) { // domingo, último dia da semana - nova linha
          table += '</tr><tr>';
        }

        d.setDate(d.getDate() + 1);
      }

      // adiciona espaços depois dos últimos dias do mês para a última linha
      // 29 30 31 * * * *
      if (getDay(d) != 0) {
        for (let i = getDay(d); i < 7; i++) {
          table += '<td></td>';
        }
      }

      // fecha a tabela
      table += '</tr></table>';

      elem.innerHTML = table;
    }

    function getDay(date) { // obtém o número do dia de 0 (segunda) a 6 (domingo)
      let day = date.getDay();
      if (day == 0) day = 7; // faz o domingo (0) ser o último dia
      return day - 1;
    }

    createCalendar(calendar, 2012, 9);
  </script>

</body>
</html>
