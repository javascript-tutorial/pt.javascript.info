<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
</head>

<body>

  <input type="button" id="hider" value="Clique para ocultar o texto" />

  <div id="text">Texto</div>

  <script>
    // Aqui não importa como ocultamos o texto,
    // também poderíamos usar style.display:
    document.getElementById('hider').onclick = function() {
      document.getElementById('text').hidden = true;
    }
  </script>
</body>
</html>
