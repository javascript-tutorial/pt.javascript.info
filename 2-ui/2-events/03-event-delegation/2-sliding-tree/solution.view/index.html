<!DOCTYPE HTML>
<html>

<head>
  <style>
    .tree span:hover {
      font-weight: bold;
    }

    .tree span {
      cursor: pointer;
    }
  </style>
  <meta charset="utf-8">
</head>

<body>

  <ul class="tree" id="tree">
    <li>Animais
      <ul>
        <li>Mamíferos
          <ul>
            <li>Vacas</li>
            <li>Burros</li>
            <li>Cachorros</li>
            <li>Tigres</li>
          </ul>
        </li>
        <li>Outros
          <ul>
            <li>Cobras</li>
            <li>Pássaros</li>
            <li>Lagartos</li>
          </ul>
        </li>
      </ul>
    </li>
    <li>Peixes
      <ul>
        <li>Aquário
          <ul>
            <li>Guppy</li>
            <li>Peixe-anjo</li>
          </ul>
        </li>
        <li>Mar
          <ul>
            <li>Truta marinha</li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>

  <script>
    // move todo o texto para <span>
    // eles ocupam exatamente o espaço necessário para o texto,
    for (let li of tree.querySelectorAll('li')) {
      let span = document.createElement('span');
      li.prepend(span);
      span.append(span.nextSibling); // move o nó de texto para dentro do span
    }

    // captura cliques na árvore inteira
    tree.onclick = function(event) {

      if (event.target.tagName != 'SPAN') {
        return;
      }

      let childrenContainer = event.target.parentNode.querySelector('ul');
      if (!childrenContainer) return; // sem filhos

      childrenContainer.hidden = !childrenContainer.hidden;
    }
  </script>

</body>
</html>
