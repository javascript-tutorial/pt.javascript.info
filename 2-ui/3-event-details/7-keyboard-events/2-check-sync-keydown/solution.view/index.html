<!DOCTYPE HTML>
<html>
<body>

  <p>Pressione "Q" e "W" juntas (pode ser em qualquer idioma).</p>

  <script>
    function runOnKeys(func, ...codes) {
      let pressed = new Set();

      document.addEventListener('keydown', function(event) {
        pressed.add(event.code);

        for (let code of codes) { // todas as teclas estão no set?
          if (!pressed.has(code)) {
            return;
          }
        }

        // sim, estão

        // durante o alert, se o visitante liberar as teclas,
        // o JavaScript não recebe o evento "keyup"
        // e o set pressed vai continuar assumindo que a tecla está pressionada
        // então, para evitar teclas "coladas", resetamos o status
        // se o usuário quiser executar a hotkey novamente - deixe-o pressionar todas as teclas de novo
        pressed.clear();

        func();
      });

      document.addEventListener('keyup', function(event) {
        pressed.delete(event.code);
      });

    }

    runOnKeys(
      () => alert("Hello!"),
      "KeyQ",
      "KeyW"
    );
  </script>

</body>

</html>
