<!DOCTYPE html>
<link rel="stylesheet" href="style.css">

<div id="slider" class="slider">
  <div class="thumb"></div>
</div>

<p style="border:1px solid gray" onmousemove="this.textContent = new Date()">Passe o mouse aqui para ver a data</p>

<script>
  let thumb = slider.querySelector('.thumb');
  let shiftX;

  function onThumbDown(event) {
    event.preventDefault(); // previne o início da seleção (ação do navegador)

    shiftX = event.clientX - thumb.getBoundingClientRect().left;

    thumb.setPointerCapture(event.pointerId);

    thumb.onpointermove = onThumbMove;

    thumb.onpointerup = event => {
      // arrasto concluído, não é mais necessário rastrear o ponteiro
      // ...qualquer outra lógica de "fim do arrasto" aqui...
      thumb.onpointermove = null;
      thumb.onpointerup = null;
    }
  };

  function onThumbMove(event) {
    let newLeft = event.clientX - shiftX - slider.getBoundingClientRect().left;

    // se o ponteiro está fora do slider => ajusta o left para ficar dentro dos limites
    if (newLeft < 0) {
      newLeft = 0;
    }
    let rightEdge = slider.offsetWidth - thumb.offsetWidth;
    if (newLeft > rightEdge) {
      newLeft = rightEdge;
    }

    thumb.style.left = newLeft + 'px';
  };

  thumb.onpointerdown = onThumbDown;

  thumb.ondragstart = () => false;

</script>
